<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0">
    <meta name="description" content="Receive and control GlassCast video on Meta Ray-Ban Display glasses.">
    <meta name="mrbd-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>GlassCast Receiver</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="display-page">
    <main id="receiverShell" class="display-shell" aria-label="GlassCast Receiver">
      <div id="receiverOverlay" class="receiver-overlay overlay-visible">
        <header class="display-header">
          <div class="brand-lockup" aria-label="GlassCast">
            <img src="/brand/glasscast-logo-primary-transparent.png" alt="GlassCast">
          </div>
          <button id="showCodeButton" class="focusable secondary-button hidden" type="button">Show code</button>
        </header>

        <section id="codeOverlay" class="code-overlay" aria-live="polite">
          <p id="stateEyebrow" class="label">Waiting for phone</p>
          <div id="sessionCode" class="session-code">------</div>
          <h1 id="stateTitle" class="state-title">Open GlassCast on your phone and enter this code</h1>
          <p id="stateHelp" class="overlay-help">Keep this screen open.</p>
          <button id="retryButton" class="focusable primary-button hidden" type="button">Retry connection</button>
        </section>

        <footer class="display-footer">
          <div>
            <p id="playbackLabel" class="label">Receiver</p>
            <p id="nowPlaying" class="now-playing">Ready for a video</p>
          </div>
          <p id="statusText" class="status-text" aria-live="polite">Waiting for phone</p>
          <p id="controlsStatus" class="controls-status">Controls available when video starts</p>
        </footer>
      </div>

      <section class="player-panel" aria-label="Player">
        <div id="playerHost" class="player-host">
          <div class="empty-state">
            <p>Waiting for phone</p>
            <span>Enter the code shown on this display.</span>
          </div>
        </div>
      </section>
      <section id="tapToPlayOverlay" class="tap-play-overlay hidden" aria-live="polite">
        <button
          id="tapToPlayButton"
          class="focusable tap-play-button"
          type="button"
          tabindex="0"
          aria-label="Tap to Play"
        >
          <span class="tap-play-title">Start video</span>
          <span class="tap-play-help">Autoplay was blocked. Select to play.</span>
        </button>
        <p id="tapToPlayStatus" class="tap-play-status hidden"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
